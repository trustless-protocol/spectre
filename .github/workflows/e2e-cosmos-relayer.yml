name: E2E — CosmosRelayer

# Manually-triggered matrix run of TestWithCosmosRelayerTestSuite (Cosmos <->
# Cosmos relaying: recv/ack/timeout, client updates). Spins up a second Cosmos
# chain, so it is heavier than the single-chain suites. Delegates to the
# reusable e2e-suite.yml. Trigger from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA to run against (defaults to the triggering ref)
        required: false
        type: string
      filter:
        description: Optional method-name substring (e.g. "ICS20", "Timeout"). Empty runs all.
        required: false
        type: string

jobs:
  run:
    uses: ./.github/workflows/e2e-suite.yml
    secrets: inherit
    with:
      suite: TestWithCosmosRelayerTestSuite
      ref: ${{ inputs.ref }}
      filter: ${{ inputs.filter }}
      # Two Cosmos chains per test — keep concurrency lower.
      max_parallel: 4
      timeout_minutes: 60
