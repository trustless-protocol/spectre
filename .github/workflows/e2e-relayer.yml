name: E2E — Relayer

# Manually-triggered matrix run of TestWithRelayerTestSuite (recv/ack/timeout
# relaying both directions, batched & filtered packets, multi-period & historical
# client updates). Delegates to the reusable e2e-suite.yml. Heavy — trigger from
# the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA to run against (defaults to the triggering ref)
        required: false
        type: string
      filter:
        description: Optional method-name substring (e.g. "RecvPacket", "ToCosmos"). Empty runs all.
        required: false
        type: string

jobs:
  run:
    uses: ./.github/workflows/e2e-suite.yml
    secrets: inherit
    with:
      suite: TestWithRelayerTestSuite
      ref: ${{ inputs.ref }}
      filter: ${{ inputs.filter }}
      max_parallel: 6
      # Historical / multi-period client-update tests need extra block history.
      timeout_minutes: 75
