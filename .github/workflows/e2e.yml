name: E2E (manual)

# Manually-triggered end-to-end run of the interchaintest (e2e/interchaintestv8)
# suites against a Kurtosis-spun Ethereum PoS devnet + a local Cosmos chain.
# Structure adapted from solidity-ibc-eureka's e2e workflow. These tests are
# heavy (Docker + Kurtosis + Groth16 proving), so they never run automatically —
# trigger from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      test:
        description: >-
          Test selector passed to `just test-e2e` (Go -run regex), e.g.
          TestWithRelayerTestSuite/TestRelayerInfo or
          TestWithIbcEurekaTestSuite/TestDeploy_Groth16
        required: true
        type: string
      ref:
        description: Branch/tag/SHA to run against (defaults to the triggering ref)
        required: false
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Private gnark submodules need a token with read access to
      # decentrio/gnark + decentrio/ecip-gnark (SUBMODULE_TOKEN secret).
      # fast-ibc via the default GITHUB_TOKEN; private gnark submodules are
      # initialised separately below with SUBMODULE_TOKEN.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout private gnark submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/decentrio/gnark".insteadOf "https://github.com/decentrio/gnark"
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/decentrio/ecip-gnark".insteadOf "https://github.com/decentrio/ecip-gnark"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Garaga FFI (libgaraga_rs)
        working-directory: third_party/ecip-gnark/ffi/garaga_rs
        run: |
          cargo build --release
          cp target/release/libgaraga_rs.so ../..

      - uses: actions/setup-go@v5
        with:
          go-version-file: relayer/go.mod
          cache: true

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: oven-sh/setup-bun@v2

      - uses: extractions/setup-just@v2

      - name: Install JS deps (forge remappings / tooling)
        run: bun install --frozen-lockfile

      - name: Install Kurtosis
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" \
            | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt update
          # Pin the CLI to the engine API version the interchaintest SDK expects
          # (kurtosis/api/golang in e2e/interchaintestv8/go.mod); a newer/older CLI
          # starts an engine whose API version mismatches and the suite aborts.
          sudo apt install -y kurtosis-cli=1.16.6
          kurtosis analytics disable
          # The interchaintest suite connects to a running local Kurtosis engine
          # (127.0.0.1:9710); the CLI does not auto-start it.
          kurtosis engine start

      - name: Run E2E test
        # The just test-e2e recipe builds contracts, installs the relayer binary,
        # generates the prover artifacts, and runs interchaintest with
        # ETH_TESTNET_TYPE=pos. The relayer/prover subprocesses dlopen
        # libgaraga_rs.so, so it must be on the loader path.
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ecip-gnark
          ETH_TESTNET_TYPE: pos
        run: just test-e2e '${{ inputs.test }}'
