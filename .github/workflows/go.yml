name: Go

# Temporarily disabled: this workflow only runs on manual dispatch for now.
# Re-enable auto-runs by restoring the push/pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # The gnark forks are private Go modules; keep them off the public proxy and
      # checksum DB. libgaraga_rs lives in .artifacts/native (see scripts/build-garaga-ffi.sh).
      GOPRIVATE: github.com/decentrio/*
      CGO_LDFLAGS: -L${{ github.workspace }}/.artifacts/native
    steps:
      - uses: actions/checkout@v4

      # decentrio/gnark and decentrio/ecip-gnark are private repos, which GITHUB_TOKEN
      # cannot read. Authenticate just those two URLs with SUBMODULE_TOKEN (a PAT
      # with read access to both) so `go` can fetch them as modules.
      # Scoped insteadOf so go mod / bun fetches of public repos are unaffected.
      - name: Authenticate private gnark modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/decentrio/gnark".insteadOf "https://github.com/decentrio/gnark"
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/decentrio/ecip-gnark".insteadOf "https://github.com/decentrio/ecip-gnark"

      - uses: actions/setup-go@v5
        with:
          go-version-file: relayer/go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      # ecip-gnark's prover links a Rust FFI (libgaraga_rs). Build it from the module
      # pinned in relayer/go.mod into .artifacts/native, which CGO_LDFLAGS points at.
      - name: Build Garaga FFI (libgaraga_rs)
        run: scripts/build-garaga-ffi.sh

      - name: Build
        working-directory: relayer
        run: go build ./...

      - name: Test
        working-directory: relayer
        # libgaraga_rs.so is not on the default loader path; point the runtime at it.
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.artifacts/native
        run: go test ./...

      # The Optimism attestor sidecar is its own module with no native dependencies.
      - name: Build Optimism attestor
        working-directory: attestor/optimism
        run: go build ./...

      - name: Test Optimism attestor
        working-directory: attestor/optimism
        run: go test ./...
