name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache: true

      - name: Build
        working-directory: operator
        run: go build ./...

      - name: Test
        working-directory: operator
        run: go test ./...
