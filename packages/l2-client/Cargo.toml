[package]
name = "l2-client"
description = "Shared lifecycle and packet helpers for L2 ICS-08 Wasm clients"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

[dependencies]
alloy-primitives = { workspace = true, features = ["rlp", "serde"] }
alloy-rlp = { workspace = true }
cosmwasm-std = { workspace = true, features = ["std", "stargate"] }
ethereum-trie-db = { workspace = true }
ibc-proto = { workspace = true }
prost = { workspace = true, features = ["std"] }
rlp = { workspace = true, features = ["std"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
